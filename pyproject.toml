[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunchback-detection"
version = "0.1.0"
description = "Local-first live posture feedback with MediaPipe and FastAPI"
readme = "README.md"
authors = [
    { name = "Ali Reza" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "fastapi>=0.115,<1",
    "mediapipe==0.10.21",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.9,<5",
    "pillow>=10,<13",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx2>=2.10,<3",
    "mypy>=1.11,<2",
    "packaging>=24,<27",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/alirezarashidipp/hunchback-detection"
Issues = "https://github.com/alirezarashidipp/hunchback-detection/issues"
Repository = "https://github.com/alirezarashidipp/hunchback-detection"

[project.scripts]
hunchback-live = "hunchback_detection.video_stream:run_live_cli"
hunchback-video = "hunchback_detection.video_stream:run_video_cli"
hunchback-web = "hunchback_detection.web:run_web_cli"

[tool.setuptools.package-data]
hunchback_detection = [
    "static/assets/*.svg",
    "static/css/*.css",
    "static/js/*.js",
    "templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hunchback_detection"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2", "mediapipe", "numpy"]
ignore_missing_imports = true
