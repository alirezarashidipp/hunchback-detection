[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunchback-detection"
version = "0.1.0"
description = "Real-time posture detection using MediaPipe and OpenCV"
readme = "README.md"
authors = [
    { name = "Ali", email = "example@example.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.6",
    "numpy>=1.21"
]

[project.urls]
Home = "https://github.com/alirezarashidipp/hunchback-detection"

[project.scripts]
hunchback-live = "hunchback_detection.video_stream:run_live_cli"
hunchback-video = "hunchback_detection.video_stream:run_video_cli"